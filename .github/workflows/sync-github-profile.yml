name: Sync GitHub Profile Data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:17 UTC
    - cron: '17 6 * * 1'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync live GitHub data
        run: node scripts/sync-github-profile.mjs

      - name: Generate local activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-activity-graph.mjs

      - name: Render portfolio and profile README
        run: node scripts/render-github-profile.mjs

      - name: Commit generated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json docs/assets/activity-graph.svg index.html README.md
          git diff --cached --quiet || git commit -m "chore: sync portfolio from GitHub [skip ci]"
          git push
